name: universally
description: It depends on universally plug and can update the latest available version in time
version: 12.0.0
repository: https://github.com/Wayaer/universally.git

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  android_intent_plus: ^6.1.0
  permission_handler: ^13.0.2
  permission_handler_harmonyos: ^13.0.2
  path_provider: ^2.1.6
  path_provider_harmonyos: ^2.1.6
  url_launcher: ^6.3.3
  url_launcher_harmonyos: ^6.3.3
  package_info_plus: ^10.2.2
  package_info_plus_harmonyos: ^10.2.2
  connectivity_plus: ^7.3.2
  connectivity_plus_harmonyos: ^7.3.2
  device_info_plus: ^13.3.0
  device_info_plus_harmonyos: ^13.3.0
  shared_preferences: ^2.5.6
  shared_preferences_harmonyos: ^2.5.6

  extended_image: ^10.1.0
  extended_image_library: ^5.0.1
  window_manager: ^0.6.0
  flutter_curiosity: ^8.0.1

  path: ^1.9.1
  provider: ^6.1.5+1
  flutter_svg: ^2.3.2
  async: ^2.13.1
  decimal: ^3.2.6
  flutter_spinkit: ^5.2.2
  keframe: ^3.0.0
  synchronized: ^3.5.0

  flutter_waya: ^12.0.0
  fl_extended: ^5.1.0
  fl_list_wheel: ^1.0.0
  fl_scroll_view: ^2.1.0
  fl_dio: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Universally
      fonts:
        - asset: assets/Universally.ttf
